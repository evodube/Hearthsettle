; Hearthsettle - stops loose clutter flying when a cell loads.
; For a few seconds after a cell loads, loose objects are held steady: they can settle
; gently into place but can't be launched. Afterwards they behave exactly like vanilla.

[General]
; Turn the whole plugin on or off.
bEnabled = true

; Write per-cell details to Documents/My Games/Skyrim Special Edition/SKSE/Hearthsettle.log
; (VR: Documents/My Games/Skyrim VR/SKSE/Hearthsettle.log)
bDebugLog = false

; How long (seconds) objects are held after the load screen closes.
; Raise this if things still pop a moment after you load in.
fSettleSeconds = 2.0

; Some objects are placed slightly inside a shelf or table and get pushed out every frame.
; When their time is up they would fly, so instead they keep being held (they can still be
; bumped gently or picked up) until they calm down, or until you leave the cell.
bHoldStuck = true

; An object is let go once it has gone this long (seconds) without needing to be slowed.
fCalmSeconds = 0.5

; Leave hanging and hinged objects alone (lanterns on chains, swinging signs), so they
; keep swaying in the wind (e.g. Dynamic Wind) or when bumped.
bSkipHanging = true

[Physics]
; Speed limits while settling. 1.0 is about 1 metre per second.
; Lower = steadier, higher = more natural if objects need to drop into place.
fMaxLinearSpeed = 1.0
fMaxAngularSpeed = 3.0

; Once an object is clearly being pushed (stuck inside a shelf, wall or another object),
; it gets this much tighter limit, so it creeps out instead of sliding off.
fStuckMaxLinearSpeed = 0.1
fStuckMaxAngularSpeed = 0.5

; Also enforce the speed limits inside each physics step, so a launch is stopped before
; it moves the object at all. The plugin checks it can read the game's values correctly
; first and switches this off by itself (and says so in the log) if it can't.
bInStepLimit = true

; Extra damping while settling (vanilla clutter is usually 0-1). Higher = calmer.
fSettleLinearDamping = 8.0
fSettleAngularDamping = 8.0

[Objects]
; Which kinds of loose objects to hold steady.
bMisc = true            ; plates, cups, cutlery, tools, buckets, clutter
bFood = true            ; food, drinks and potions
bIngredients = true
bBooks = true
bWeapons = true
bArmor = true
bKeys = true
bSoulGems = true
bScrolls = true
bAmmo = true
bLights = true          ; carryable lanterns and torches
bMovableStatics = false ; physics-enabled statics (barrels, some debris)
