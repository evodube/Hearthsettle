name: Build

on:
  push:
    branches: [main, vr]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # for publishing releases on tag pushes

env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_binary_cache,readwrite"
  VCPKG_BASELINE: 00c5775211f45cd08b37fce0484b4cb940e422ab

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4.0.0
        with:
          arch: x64

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_BASELINE }}
          runVcpkgInstall: false

      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/vcpkg_binary_cache
          key: ${{ runner.os }}-vcpkg-x64-windows-static-md-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-x64-windows-static-md-

      - name: Configure
        run: |
          New-Item -ItemType Directory -Force "${{ github.workspace }}/vcpkg_binary_cache" | Out-Null
          cmake --preset release

      - name: Build
        run: |
          cmake --build --preset release -- -k 0 2>&1 | Tee-Object -FilePath build-output.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Surface linker/tool errors (which have no file:line) as one annotation.
            $lines = Select-String -Path build-output.txt -Pattern 'error|FAILED|unresolved|LNK|fatal' |
              Select-Object -First 40 | ForEach-Object { $_.Line.Trim() }
            $msg = ($lines -join "`n") -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
            Write-Output "::error title=Build errors::$msg"
            exit $code
          }

      - name: Package
        id: package
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "dev-$("${{ github.sha }}".Substring(0,7))" }
          $zip = "Hearthsettle-$version.zip"
          Compress-Archive -Path dist/Hearthsettle/* -DestinationPath $zip -Force
          $files = (Get-ChildItem -Recurse -File dist/Hearthsettle | ForEach-Object { $_.FullName.Substring((Resolve-Path dist/Hearthsettle).Path.Length + 1) }) -join ', '
          Write-Output "::notice title=Package contents::$files"
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload mod
        uses: actions/upload-artifact@v6
        with:
          name: Hearthsettle
          path: dist/Hearthsettle/

      - name: Upload debug symbols
        uses: actions/upload-artifact@v6
        with:
          name: Hearthsettle-pdb
          path: build/release/Hearthsettle.pdb

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            $pre = if ($tag -like "*-*") { "--prerelease" } else { $null }
            gh release create $tag --title "Hearthsettle $tag" --generate-notes $pre
          }
          gh release upload $tag "${{ steps.package.outputs.zip }}" build/release/Hearthsettle.pdb --clobber
